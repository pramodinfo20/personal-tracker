<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#16233f"/>
      <stop offset="55%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f8fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2f8fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background: required for maskable icons -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- gate/vortex rings, echoing the app's 🌀 Gate motif -->
  <g fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="170" stroke="#2f8fff" stroke-opacity="0.55" stroke-width="22"
      stroke-dasharray="769.06 299.08" transform="rotate(-20 256 256)"/>
    <circle cx="256" cy="256" r="120" stroke="#2f8fff" stroke-opacity="0.8" stroke-width="20"
      stroke-dasharray="542.87 211.12" transform="rotate(110 256 256)"/>
    <circle cx="256" cy="256" r="70" stroke="#57a6ff" stroke-width="18"
      stroke-dasharray="316.67 123.15" transform="rotate(240 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="15" fill="#e8edf9"/>
</svg>
